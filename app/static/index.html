<!DOCTYPE html>
<html>
<head>
    <title>WorldoTutors AI Assistant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        #chat {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 14px;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .user {
            background: #e8f0fe;
            text-align: right;
        }

        .ai {
            background: #f1f1f1;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>WorldoTutors AI Assistant</h2>

    <div id="chat"></div>

    <div class="input-area">
        <input
            type="text"
            id="question"
            placeholder="Ask your question..."
        >
        <button id="send">Send</button>
    </div>
</div>

<script>
    const chat = document.getElementById("chat");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");

    let chatHistory = [];

    function addMessage(role, content) {
        const message = document.createElement("div");

        message.className = "message " + role;
        message.textContent = content;

        chat.appendChild(message);
        chat.scrollTop = chat.scrollHeight;

        return message;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();

        if (!question) {
            return;
        }

        questionInput.value = "";
        sendButton.disabled = true;

        addMessage("user", question);

        const aiMessage = addMessage("ai", "Thinking...");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question,
                    chat_history: chatHistory
                })
            });

            const data = await response.json();

            aiMessage.textContent = data.answer;

            chatHistory.push({
                role: "user",
                content: question
            });

            chatHistory.push({
                role: "assistant",
                content: data.answer
            });

        } catch (error) {
            aiMessage.textContent = "Something went wrong. Please try again.";
        }

        sendButton.disabled = false;
        questionInput.focus();
    }

    sendButton.addEventListener("click", sendQuestion);

    questionInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendQuestion();
        }
    });
</script>

</body>
</html>
